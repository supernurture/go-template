version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: development
    # A new release waits a week first.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    # The Review workflow's commitlint wants conventional commits.
    commit-message:
      prefix: chore
      include: scope
    # Released in lockstep: bumped one at a time, a module pins its siblings at the old version and breaks the build.
    groups:
      opentelemetry:
        patterns: ["go.opentelemetry.io/*"]
      go-redis:
        patterns: ["github.com/redis/go-redis/*"]
      prometheus:
        patterns: ["github.com/prometheus/*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    # A new release waits a week first.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
  # Dockerfile base images.
  - package-ecosystem: docker
    directory: /
    target-branch: development
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
  # compose.yaml images.
  - package-ecosystem: docker-compose
    directory: /
    target-branch: development
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      # 18 moved PGDATA; see compose.yaml.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
