version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: development
    # Let a freshly published version sit a week before we pick it up.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    # Conventional commits: the Review workflow's commitlint fails anything else.
    commit-message:
      prefix: chore
      include: scope
    # Released in lockstep: bumped one PR at a time, a module pins its siblings at the old
    # version and the build breaks, or tidy fails, until the rest follow.
    groups:
      opentelemetry:
        patterns: ["go.opentelemetry.io/*"]
      go-redis:
        patterns: ["github.com/redis/go-redis/*"]
      prometheus:
        patterns: ["github.com/prometheus/*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    # Let a freshly published version sit a week before we pick it up.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
  # Dockerfile base images.
  - package-ecosystem: docker
    directory: /
    target-branch: development
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
  # compose.yaml images.
  - package-ecosystem: docker-compose
    directory: /
    target-branch: development
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      # 18 moved PGDATA; see compose.yaml.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
